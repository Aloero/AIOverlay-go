<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob:; media-src data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>AIOverlay · Pipeline Studio</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/studio.css"><link rel="stylesheet" href="/assets/workspace.css"><script src="/assets/app.js" defer></script><script src="/assets/studio-lifecycle.js" defer></script><script src="/assets/studio-workspace.js" defer></script><script src="/assets/pipeline-runtime.js" defer></script><script src="/assets/application-settings.js" defer></script><script src="/assets/vpn-view.js" defer></script><script src="/assets/benchmark-view.js" defer></script><script src="/assets/prompt-preview.js" defer></script><script src="/assets/run-insights.js" defer></script><script src="/assets/simulation-view.js" defer></script><script src="/assets/connections.js" defer></script><script src="/assets/connection-hub.js" defer></script><script src="/assets/catalog-view.js" defer></script><script src="/assets/schedule-view.js" defer></script><script src="/assets/pool-plan.js" defer></script><script src="/assets/pool-editor.js" defer></script><script src="/assets/model-settings.js" defer></script><script src="/assets/studio-interactions.js" defer></script><script src="/assets/pipeline-view.js" defer></script></head><body>
<div id="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">A<span>·</span></span><div><strong>AIOverlay</strong><small>PIPELINE STUDIO</small></div></div><nav aria-label="Разделы"><button class="nav active" data-page="pipelines"><span data-icon="flow"></span>Пайплайны</button><button class="nav" data-page="providers"><span data-icon="server"></span>Провайдеры<span id="providerCount" class="count"></span></button><button class="nav" data-page="runs"><span data-icon="activity"></span>Запуски</button><button class="nav" data-page="settings"><span data-icon="settings"></span>Приложение</button></nav><div class="sidebar-section"><span>МОИ ПАЙПЛАЙНЫ</span><button id="newPipeline" class="icon-button" title="Новый пайплайн">+</button></div><div id="pipelineList" class="pipeline-list"></div><div class="sidebar-bottom"><button id="exportConfig" class="text-button"><span data-icon="export"></span>Экспорт JSON</button><button id="importConfig" class="text-button"><span data-icon="import"></span>Импорт JSON</button></div></aside>
<div class="main"><header class="topbar"><div class="workspace-tools"><button id="toggleSidebar" class="icon-button" aria-label="Свернуть навигацию" aria-expanded="true" data-help="Свернуть левую колонку, чтобы освободить место графу.">☰</button><b id="breadcrumb">Пайплайны</b><button id="findSetting" class="button small subtle" aria-label="Найти настройку"><span data-icon="search"></span><span class="search-caption">Найти</span><kbd>Ctrl K</kbd></button></div><div class="top-actions"><span id="saveState" class="save-state hidden"><i></i>Черновик</span><button id="undoDraft" class="icon-button" title="Отменить правку черновика (Ctrl+Z)" aria-label="Отменить правку">↶</button><button id="redoDraft" class="icon-button" title="Повторить правку (Ctrl+Y)" aria-label="Повторить правку">↷</button><button id="restoreDraft" class="icon-button" title="Вернуть сохранённые настройки" aria-label="Вернуть сохранённое">⟲</button><button id="saveConfig" class="button primary hidden"><span data-icon="save"></span>Сохранить и применить</button><button id="closeStudio" class="icon-button" title="Закрыть Studio" aria-label="Закрыть Studio">×</button></div></header><div class="applied-strip"><strong id="appliedSummary"></strong><span id="applyHint"></span><span id="currentExecution" hidden></span></div><div id="errorBanner" class="error-banner hidden" role="alert"></div><section id="page" class="page"></section><footer class="statusbar"><span id="appStatus"><i></i>Готов к работе</span><button id="helpToggle" class="text-button help-toggle" data-help="Удерживайте Alt и наведите указатель на настройку. Нажатие этой кнопки включает подсказки без удержания клавиши."><kbd>Alt</kbd> Подсказки</button><button id="aboutStudio" class="text-button">О программе</button></footer></div></div>
<dialog id="dialog"><div class="dialog-head"><div><p class="eyebrow" id="dialogEyebrow">PIPELINE STUDIO</p><h2 id="dialogTitle"></h2></div><button id="closeDialog" class="icon-button" aria-label="Закрыть">×</button></div><div id="dialogBody"></div></dialog><div id="toast" class="toast hidden" role="status"></div><input type="file" id="configFile" accept="application/json,.json" hidden><input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp" hidden></body></html>
